<!DOCTYPE html>

  <!-- Google Fonts: Inter & JetBrains Mono -->

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: '#2563eb',
              foreground: '#ffffff',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',

    }

      --border: 214.3 31.8% 91.4%;
      --input: 214.3 31.8% 91.4%;
      --ring: 221.2 83.2% 53.3%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --accent: 210 40% 96.1%;
      --accent-foreground: 222.2 47.4% 11.2%;
    }
    .dark {
      --background: 222.2 84% 4.9%;
      --foreground: 210 40% 98%;
      --card: 222.2 84% 7%;
      --card-foreground: 210 40% 98%;
      --border: 217.2 32.6% 17.5%;
      --input: 217.2 32.6% 17.5%;
      --ring: 224.3 76.3% 48%;
      --muted: 217.2 32.6% 14%;
      --muted-foreground: 215 20.2% 65.1%;
      --accent: 217.2 32.6% 17.5%;
      --accent-foreground: 210 40% 98%;
    }
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;

    ::-webkit-scrollbar-track {
      background: transparent;

    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.3);

  <!-- React & ReactDOM & Babel -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const MOCK_DATA = [
      {
        id: 'bb-001',
        ma_van_don: 'SPXVN66521522989',
        don_vi_vc: 'Shopee Express',
        carrier_code: 'Shopee',
        carrier_color: 'bg-orange-500/10 text-orange-600 border-orange-500/25 dark:text-orange-400',
        bar_color: 'bg-orange-500',
        loai_bien_ban: 'dong_goi',
        nguoi_tao: 'Quản trị viên',
        thoi_gian: '16/09/2026 20:17:35',
        thoi_luong: '01:15',
        kich_thuoc: '24.5 MB',
        trang_thai: 'da_upload',
        drive_file_id: '1aB2c3D4e5F6g7H8',
        thiet_bi: 'PC Warehouse - Webcam 1080p'
      },
      {
        id: 'bb-002',
        ma_van_don: '802821635774',
        don_vi_vc: 'Giao Hàng Nhanh',
        carrier_code: 'GHN',
        carrier_color: 'bg-amber-500/10 text-amber-600 border-amber-500/25 dark:text-amber-400',
        bar_color: 'bg-amber-500',
        loai_bien_ban: 'khui_hang',
        nguoi_tao: 'Quản trị viên',
        thoi_gian: '16/09/2026 20:14:18',
        thoi_luong: '01:15',
        kich_thuoc: '2.5 MB',
        trang_thai: 'da_upload',
        drive_file_id: '2bC3d4E5f6G7h8I9',
        thiet_bi: 'Samsung Galaxy A54 - Cam sau'
      },
      {
        id: 'bb-003',
        ma_van_don: '86244803781',
        don_vi_vc: 'Giao Hàng Nhanh',
        carrier_code: 'GHN',
        carrier_color: 'bg-amber-500/10 text-amber-600 border-amber-500/25 dark:text-amber-400',
        bar_color: 'bg-blue-500',
        loai_bien_ban: 'dong_goi',
        nguoi_tao: 'Quản trị viên',
        thoi_gian: '16/09/2026 20:14:18',
        thoi_luong: '01:15',
        kich_thuoc: '24.5 MB',
        trang_thai: 'da_upload',
        drive_file_id: '3cD4e5F6g7H8i9J0',
        thiet_bi: 'PC Warehouse - Webcam 1080p'
      },
      {
        id: 'bb-004',
        ma_van_don: '86242403781',
        don_vi_vc: 'J&T Express',
        carrier_code: 'J&T Express',
        carrier_color: 'bg-rose-500/10 text-rose-600 border-rose-500/25 dark:text-rose-400',
        bar_color: 'bg-rose-500',
        loai_bien_ban: 'khui_hang',
        nguoi_tao: 'Quản trị viên',
        thoi_gian: '16/09/2026 20:14:18',
        thoi_luong: '00:16',
        kich_thuoc: '3.4 MB',
        trang_thai: 'da_upload',
        drive_file_id: '4dE5f6G7h8I9j0K1',
        thiet_bi: 'Xiaomi Redmi Note 12'
      },
      {
        id: 'bb-005',
        ma_van_don: '86242803781',
        don_vi_vc: 'Viettel Post',
        carrier_code: 'Viettel Post',
        carrier_color: 'bg-teal-500/10 text-teal-600 border-teal-500/25 dark:text-teal-400',
        bar_color: 'bg-teal-500',
        loai_bien_ban: 'khui_hang',
        nguoi_tao: 'Quản trị viên',
        thoi_gian: '16/09/2026 14:57:38',
        thoi_luong: '00:09',
        kich_thuoc: '2.0 MB',
        trang_thai: 'da_upload',
        drive_file_id: '5eF6g7H8i9J0k1L2',
        thiet_bi: 'PC Warehouse - Webcam 1080p'
      }
    ];

    function App() {
      const [viewMode, setViewMode] = useState('desktop'); // 'desktop' | 'mobile' | 'split'
      const [theme, setTheme] = useState('light'); // 'light' | 'dark'
      const [activeMenu, setActiveMenu] = useState('history'); // 'scan' | 'queue' | 'history' | 'settings'
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      
      // History Page state
      const [tab, setTab] = useState('all');
      const [search, setSearch] = useState('');
      const [showFilterModal, setShowFilterModal] = useState(false);
      const [showInlineFilter, setShowInlineFilter] = useState(false);
      const [datePreset, setDatePreset] = useState('7days');
      const [dateFrom, setDateFrom] = useState('2026-09-10');
      const [dateTo, setDateTo] = useState('2026-09-17');
      const [carrier, setCarrier] = useState('all');
      const [status, setStatus] = useState('all');
      const [staff, setStaff] = useState('all');
      const [device, setDevice] = useState('all');
      const [selectedItem, setSelectedItem] = useState(null);
      const [copiedId, setCopiedId] = useState(null);
      const [currentPage, setCurrentPage] = useState(1);
      const [pageSize, setPageSize] = useState(10);
      const totalRecords = 118;
      const totalPages = Math.ceil(totalRecords / pageSize);

      // Re-trigger lucide icons on render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [viewMode, theme, activeMenu, sidebarCollapsed, tab, search, showFilterModal, showInlineFilter, datePreset, dateFrom, dateTo, carrier, status, staff, device, selectedItem, currentPage, pageSize]);

      const toggleTheme = () => {
        const next = theme === 'light' ? 'dark' : 'light';
        setTheme(next);
        const root = document.documentElement;
        if (next === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      };

      const handleCopy = (text, id) => {
        navigator.clipboard?.writeText(text);
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 1500);
      };

      const activeFiltersCount = useMemo(() => {
        let cnt = 0;
        if (datePreset !== '7days') cnt++;
        if (carrier !== 'all') cnt++;
        if (status !== 'all') cnt++;
        if (staff !== 'all') cnt++;
        if (device !== 'all') cnt++;
        return cnt;
      }, [datePreset, carrier, status, staff, device]);

      const handleResetFilters = () => {
        setDatePreset('7days');
        setDateFrom('2026-09-10');
        setDateTo('2026-09-17');
        setCarrier('all');
        setStatus('all');
        setStaff('all');
        setDevice('all');
      };

      const filteredItems = useMemo(() => {
        return MOCK_DATA.filter(item => {
          if (tab !== 'all' && item.loai_bien_ban !== tab) return false;
          if (search.trim() && !item.ma_van_don.toLowerCase().includes(search.toLowerCase())) return false;
          if (carrier !== 'all' && !item.don_vi_vc.toLowerCase().includes(carrier.toLowerCase()) && item.carrier_code !== carrier) return false;
          if (status !== 'all' && item.trang_thai !== status) return false;
          if (staff !== 'all') {
            if (staff === 'admin' && !item.nguoi_tao.toLowerCase().includes('quản trị')) return false;
            if (staff === 'nv01' && !item.nguoi_tao.toLowerCase().includes('kho')) return false;
          }
          if (device !== 'all') {
            if (device === 'pc' && !item.thiet_bi.toLowerCase().includes('pc') && !item.thiet_bi.toLowerCase().includes('webcam')) return false;
            if (device === 'mobile' && !item.thiet_bi.toLowerCase().includes('samsung') && !item.thiet_bi.toLowerCase().includes('redmi') && !item.thiet_bi.toLowerCase().includes('cam')) return false;
          }
          return true;
        });
      }, [tab, search, carrier, status, staff, device]);

      const counts = {
        all: MOCK_DATA.length,
        dong_goi: MOCK_DATA.filter(i => i.loai_bien_ban === 'dong_goi').length,
        khui_hang: MOCK_DATA.filter(i => i.loai_bien_ban === 'khui_hang').length
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Global Control Toolbar */}
          <header className="sticky top-0 z-50 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between flex-wrap gap-2">
            <div className="flex items-center gap-3">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <div className="flex items-center gap-2">
                <span className="font-bold text-sm tracking-tight text-white">
                  MOCKUP TOÀN BỘ HỆ THỐNG
                </span>
                <span className="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-400 border border-amber-500/30">
                  {activeMenu === 'scan' && 'Tab: Quét & Quay'}
                  {activeMenu === 'queue' && 'Tab: Hàng Đợi Upload'}
                  {activeMenu === 'history' && 'Tab: Lịch Sử Biên Bản'}
                  {activeMenu === 'settings' && 'Tab: Cài Đặt Hệ Thống'}
                </span>
              </div>
            </div>

            {/* View Mode Switcher + Menu Fast Switch */}
            <div className="flex items-center gap-2 flex-wrap">
              {/* Menu Quick Select */}
              <div className="inline-flex bg-slate-900 p-0.5 rounded-lg border border-slate-800 text-xs">
                {[
                  { id: 'scan', label: 'Quét & Quay', icon: 'scan-line' },
                  { id: 'queue', label: 'Hàng đợi (2)', icon: 'upload-cloud' },
                  { id: 'history', label: 'Lịch sử', icon: 'history' },
                  { id: 'settings', label: 'Cài đặt', icon: 'settings' }
                ].map(m => (
                  <button
                    key={m.id}
                    onClick={() => setActiveMenu(m.id)}
                    className={`px-2.5 py-1 rounded-md font-semibold flex items-center gap-1.5 transition-all ${
                      activeMenu === m.id
                        ? 'bg-amber-500 text-white shadow-xs'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <i data-lucide={m.icon} class="w-3.5 h-3.5"></i>
                    <span>{m.label}</span>
                  </button>
                ))}
              </div>

              {/* Viewport Select */}
              <div className="inline-flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
                <button
                  onClick={() => setViewMode('desktop')}
                  className={`px-3 py-1.5 rounded-md font-medium flex items-center gap-1.5 transition-all ${
                    viewMode === 'desktop'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
                  <span>Desktop</span>
                </button>
                <button
                  onClick={() => setViewMode('mobile')}
                  className={`px-3 py-1.5 rounded-md font-medium flex items-center gap-1.5 transition-all ${
                    viewMode === 'mobile'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
                  <span>Mobile</span>
                </button>
                <button
                  onClick={() => setViewMode('split')}
                  className={`px-3 py-1.5 rounded-md font-medium flex items-center gap-1.5 transition-all ${
                    viewMode === 'split'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <i data-lucide="columns" class="w-3.5 h-3.5"></i>
                  <span>Song song</span>
                </button>
              </div>

              {/* Quick Filter Modal Preview Button */}
              {activeMenu === 'history' && (
                <button
                  onClick={() => setShowFilterModal(true)}
                  className={`px-3 py-1.5 rounded-md font-semibold flex items-center gap-1.5 transition-all text-xs cursor-pointer ${
                    activeFiltersCount > 0
                      ? 'bg-primary text-white shadow-xs'
                      : 'bg-slate-800 text-slate-300 hover:text-white border border-slate-700'
                  }`}
                  title="Mở popup Bộ Lọc Nâng Cao để xem trước"
                >
                  <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 text-amber-400"></i>
                  <span>Bộ lọc {activeFiltersCount > 0 ? `(${activeFiltersCount})` : ''}</span>
                </button>
              )}

              {/* Theme toggle */}
              <button
                onClick={toggleTheme}
                className="p-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:text-white transition-colors cursor-pointer"
                title="Đổi giao diện Sáng / Tối"
              >
                <i data-lucide={theme === 'light' ? 'moon' : 'sun'} class="w-4 h-4"></i>
              </button>
            </div>
          </header>

          {/* Canvas Area */}
          <main className="flex-1 bg-slate-900/60 p-4 lg:p-8 flex items-center justify-center overflow-auto">
            {viewMode === 'desktop' && (
              <div className="w-full max-w-[1440px] bg-background text-foreground rounded-2xl shadow-2xl border border-border overflow-hidden transition-all">
                <DesktopAppView
                  activeMenu={activeMenu}
                  setActiveMenu={setActiveMenu}
                  sidebarCollapsed={sidebarCollapsed}
                  setSidebarCollapsed={setSidebarCollapsed}
                  tab={tab}
                  setTab={setTab}
                  counts={counts}
                  search={search}
                  setSearch={setSearch}
                  showFilterModal={showFilterModal}
                  setShowFilterModal={setShowFilterModal}
                  showInlineFilter={showInlineFilter}
                  setShowInlineFilter={setShowInlineFilter}
                  datePreset={datePreset}
                  setDatePreset={setDatePreset}
                  dateFrom={dateFrom}
                  setDateFrom={setDateFrom}
                  dateTo={dateTo}
                  setDateTo={setDateTo}
                  carrier={carrier}
                  setCarrier={setCarrier}
                  status={status}
                  setStatus={setStatus}
                  staff={staff}
                  setStaff={setStaff}
                  device={device}
                  setDevice={setDevice}
                  activeFiltersCount={activeFiltersCount}
                  onResetFilters={handleResetFilters}
                  items={filteredItems}
                  onSelectVideo={(item) => setSelectedItem(item)}
                  copiedId={copiedId}
                  onCopy={handleCopy}
                  theme={theme}
                  onToggleTheme={toggleTheme}
                  currentPage={currentPage}
                  setCurrentPage={setCurrentPage}
                  pageSize={pageSize}
                  setPageSize={setPageSize}
                  totalRecords={totalRecords}
                  totalPages={totalPages}
                />
              </div>
            )}

            {viewMode === 'mobile' && (
              <div className="w-[390px] h-[844px] bg-background text-foreground rounded-[44px] shadow-2xl border-[8px] border-slate-800 overflow-hidden flex flex-col relative transition-all">
                {/* iPhone Dynamic Island */}
                <div className="w-full h-7 bg-background flex items-center justify-center relative shrink-0 pt-1">
                  <div className="w-24 h-4.5 bg-black rounded-full"></div>
                </div>

                <div className="flex-1 overflow-y-auto">
                  <MobileAppView
                    activeMenu={activeMenu}
                    setActiveMenu={setActiveMenu}
                    tab={tab}
                    setTab={setTab}
                    counts={counts}
                    search={search}
                    setSearch={setSearch}
                    showFilterModal={showFilterModal}
                    setShowFilterModal={setShowFilterModal}
                    datePreset={datePreset}
                    setDatePreset={setDatePreset}
                    dateFrom={dateFrom}
                    setDateFrom={setDateFrom}
                    dateTo={dateTo}
                    setDateTo={setDateTo}
                    carrier={carrier}
                    setCarrier={setCarrier}
                    status={status}
                    setStatus={setStatus}
                    staff={staff}
                    setStaff={setStaff}
                    device={device}
                    setDevice={setDevice}
                    activeFiltersCount={activeFiltersCount}
                    onResetFilters={handleResetFilters}
                    items={filteredItems}
                    onSelectVideo={(item) => setSelectedItem(item)}
                    copiedId={copiedId}
                    onCopy={handleCopy}
                    theme={theme}
                    onToggleTheme={toggleTheme}
                    currentPage={currentPage}
                    setCurrentPage={setCurrentPage}
                    pageSize={pageSize}
                    setPageSize={setPageSize}
                    totalRecords={totalRecords}
                    totalPages={totalPages}
                  />
                </div>
              </div>
            )}

            {viewMode === 'split' && (
              <div className="w-full max-w-[1760px] flex gap-8 items-start justify-center flex-wrap xl:flex-nowrap">
                {/* Desktop Preview */}
                <div className="flex-1 min-w-[760px] bg-background text-foreground rounded-2xl shadow-2xl border border-border overflow-hidden">
                  <div className="bg-muted px-4 py-2 text-xs font-bold text-muted-foreground border-b border-border flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
                      <span>Bản Desktop — Sidebar có thể Thu gọn (Collapsible)</span>
                    </div>
                    <span className="text-[11px] font-mono">1440 x 900</span>
                  </div>
                  <DesktopAppView
                    activeMenu={activeMenu}
                    setActiveMenu={setActiveMenu}
                    sidebarCollapsed={sidebarCollapsed}
                    setSidebarCollapsed={setSidebarCollapsed}
                    tab={tab}
                    setTab={setTab}
                    counts={counts}
                    search={search}
                    setSearch={setSearch}
                    showFilterModal={showFilterModal}
                    setShowFilterModal={setShowFilterModal}
                    showInlineFilter={showInlineFilter}
                    setShowInlineFilter={setShowInlineFilter}
                    datePreset={datePreset}
                    setDatePreset={setDatePreset}
                    dateFrom={dateFrom}
                    setDateFrom={setDateFrom}
                    dateTo={dateTo}
                    setDateTo={setDateTo}
                    carrier={carrier}
                    setCarrier={setCarrier}
                    status={status}
                    setStatus={setStatus}
                    staff={staff}
                    setStaff={setStaff}
                    device={device}
                    setDevice={setDevice}
                    activeFiltersCount={activeFiltersCount}
                    onResetFilters={handleResetFilters}
                    items={filteredItems}
                    onSelectVideo={(item) => setSelectedItem(item)}
                    copiedId={copiedId}
                    onCopy={handleCopy}
                    theme={theme}
                    onToggleTheme={toggleTheme}
                    currentPage={currentPage}
                    setCurrentPage={setCurrentPage}
                    pageSize={pageSize}
                    setPageSize={setPageSize}
                    totalRecords={totalRecords}
                    totalPages={totalPages}
                  />
                </div>

                {/* Mobile Preview */}
                <div className="w-[390px] h-[844px] bg-background text-foreground rounded-[44px] shadow-2xl border-[8px] border-slate-800 overflow-hidden flex flex-col shrink-0">
                  <div className="w-full h-7 bg-background flex items-center justify-center relative shrink-0 pt-1">
                    <div className="w-24 h-4.5 bg-black rounded-full"></div>
                  </div>
                  <div className="flex-1 overflow-y-auto">
                    <MobileAppView
                      activeMenu={activeMenu}
                      setActiveMenu={setActiveMenu}
                      tab={tab}
                      setTab={setTab}
                      counts={counts}
                      search={search}
                      setSearch={setSearch}
                      showFilterModal={showFilterModal}
                      setShowFilterModal={setShowFilterModal}
                      datePreset={datePreset}
                      setDatePreset={setDatePreset}
                      dateFrom={dateFrom}
                      setDateFrom={setDateFrom}
                      dateTo={dateTo}
                      setDateTo={setDateTo}
                      carrier={carrier}
                      setCarrier={setCarrier}
                      status={status}
                      setStatus={setStatus}
                      staff={staff}
                      setStaff={setStaff}
                      device={device}
                      setDevice={setDevice}
                      activeFiltersCount={activeFiltersCount}
                      onResetFilters={handleResetFilters}
                      items={filteredItems}
                      onSelectVideo={(item) => setSelectedItem(item)}
                      copiedId={copiedId}
                      onCopy={handleCopy}
                      theme={theme}
                      onToggleTheme={toggleTheme}
                      currentPage={currentPage}
                      setCurrentPage={setCurrentPage}
                      pageSize={pageSize}
                      setPageSize={setPageSize}
                      totalRecords={totalRecords}
                      totalPages={totalPages}
                    />
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Video Modal Preview */}
          {selectedItem && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-card text-card-foreground border border-border rounded-2xl shadow-2xl w-full max-w-xl p-5 flex flex-col gap-4 animate-in fade-in zoom-in-95">
                <div className="flex justify-between items-center border-b border-border pb-3">
                  <div>
                    <h3 className="font-bold text-base flex items-center gap-2">

              <span>Thiết bị Ghi hình &amp; Âm thanh</span>
            </div>

            <div className="flex flex-col gap-2.5">
              <div>
                <label className="text-[11px] font-semibold text-muted-foreground block mb-1">
                  Chọn Camera quay đóng gói
                </label>
                <select className="w-full h-10 px-3 rounded-xl border border-border bg-muted/40 font-medium text-xs text-foreground focus:outline-none">
                  <option>Camera sau (Chính 1080p) - Mặc định</option>
                  <option>Camera góc rộng (0.5x)</option>
                  <option>USB Webcam ngoài (C920)</option>
                </select>
              </div>

              <div>
                <label className="text-[11px] font-semibold text-muted-foreground block mb-1">
                  Độ phân giải video
                </label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setVideoRes('1080p')}
                    className={`h-9 rounded-xl font-bold text-xs transition-all cursor-pointer ${
                      videoRes === '1080p'
                        ? 'bg-primary text-white shadow-xs'
                        : 'border border-border bg-muted/30 text-muted-foreground'
                    }`}
                  >
                    1080p (Full HD)
                  </button>
                  <button
                    onClick={() => setVideoRes('720p')}
                    className={`h-9 rounded-xl font-bold text-xs transition-all cursor-pointer ${
                      videoRes === '720p'
                        ? 'bg-primary text-white shadow-xs'
                        : 'border border-border bg-muted/30 text-muted-foreground'
                    }`}
                  >
                    720p (Tiết kiệm)
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Section 2: Barcode Gun Config */}
          <div className="p-4 rounded-3xl border border-border bg-card shadow-xs flex flex-col gap-3">
            <div className="flex items-center gap-2 font-bold text-foreground">
              <i data-lucide="barcode" class="w-4 h-4 text-amber-500"></i>
              <span>Súng quét Barcode USB / BT</span>
            </div>

            <div className="flex flex-col gap-3">
              <div className="flex items-center justify-between py-0.5">
                <div className="pr-3">
                  <div className="font-semibold text-foreground">Tự động quay sau khi quét</div>
                  <div className="text-[10px] text-muted-foreground">Đếm 1s sau khi bắt mã và tự ghi hình</div>
                </div>
                <input
                  type="checkbox"
                  checked={autoRecord}
                  onChange={(e) => setAutoRecord(e.target.checked)}
                  className="w-4 h-4 accent-primary"
                />
              </div>

              <div className="flex items-center justify-between py-0.5 border-t border-border/60 pt-2">
                <div className="pr-3">
                  <div className="font-semibold text-foreground">Âm thanh bíp phản hồi</div>
                  <div className="text-[10px] text-muted-foreground">Phát tiếng kêu khi nhận mã hoặc quét trùng</div>
                </div>
                <input
                  type="checkbox"
                  checked={soundBeep}
                  onChange={(e) => setSoundBeep(e.target.checked)}
                  className="w-4 h-4 accent-primary"
                />
              </div>
            </div>
          </div>

          {/* Section 3: Google Drive & Cloudflare */}
          <div className="p-4 rounded-3xl border border-border bg-card shadow-xs flex flex-col gap-3">
            <div className="flex items-center gap-2 font-bold text-foreground">
              <i data-lucide="hard-drive" class="w-4 h-4 text-emerald-500"></i>
              <span>Lưu trữ Google Drive Kho</span>
            </div>

            <div className="flex flex-col gap-2">
              <div className="p-2.5 rounded-xl bg-muted/40 border border-border flex flex-col gap-0.5">
                <span className="text-[10px] text-muted-foreground">Thư mục Shared Drive</span>
                <span className="font-mono font-bold text-[11px] text-foreground truncate">
                  SHARED_DRIVE_KHO_TONG / 2026-09
                </span>
              </div>

              <div>
                <div className="flex justify-between text-[10px] text-muted-foreground mb-1 font-semibold">
                  <span>Dung lượng đã dùng</span>
                  <span>420 GB / 2 TB (21%)</span>
                </div>
                <div className="w-full h-1.5 rounded-full bg-muted overflow-hidden">
                  <div className="h-full bg-emerald-500 rounded-full" style={{ width: '21%' }}></div>
                </div>
              </div>
            </div>
          </div>

          {/* Section 4: System Info & Logout */}
          <div className="p-4 rounded-3xl border border-border bg-card shadow-xs flex flex-col gap-3">
            <div className="flex items-center justify-between text-[11px] text-muted-foreground">
              <span>Phiên bản PWA</span>
              <span className="font-mono font-bold text-foreground">v1.0.0 (Offline-Ready)</span>
            </div>

            <button className="w-full h-11 rounded-2xl border border-destructive/40 bg-destructive/5 hover:bg-destructive/10 text-destructive font-bold text-xs flex items-center justify-center gap-2 transition-colors cursor-pointer">
              <i data-lucide="log-out" class="w-4 h-4"></i>
              <span>ĐĂNG XUẤT KHỎI CA LÀM VIỆC</span>
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
